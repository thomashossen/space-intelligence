# Source registry used by `python -m app.pipeline run --fixtures`.
#
# FIXTURE CATALOGUE. Every source below is replayed from files in data/fixtures/feeds/.
# Hosts use the reserved `.example` TLD. Institution and company names are real actors,
# but every item in the fixture files is FICTITIOUS. These sources feed the tests only.
# Press titles (Kestrel Space Wire, Northline…) are invented publications.
# The live catalogue is in sources.live.toml (disabled until you check each URL).
#
# Fields
#   id               stable identifier, used in every table
#   name             display name
#   connector        rss | google_news | gdelt | youtube | arxiv | hal
#   source_type      institutional | industrial | press | aggregator | video | research
#   family           INS | IND | PRS | AGG | VID | RES  (proof-line families)
#   tier             1 institutional & primary · 2 specialised press · 3 aggregators · 4 low reliability
#                    The tier is ONE input of the credibility score, never a verdict.
#   baseline_credibility  optional 0..1 override; defaults to scoring.toml [credibility.tier_baseline]
#   domain, country, institution   provenance metadata
#   publisher_entity entity id (entities.toml) when the source IS the actor (primary source)
#   language         declared language (the cleaner still detects it)
#   fixture          file name(s) under data/fixtures/feeds/ ; a missing file simulates an unreachable source
#   url              live endpoint (unused in fixture mode)

version = "fixtures-1"

[[source]]
id = "fx-esa"
name = "ESA newsroom"
connector = "rss"
source_type = "institutional"
family = "INS"
tier = 1
domain = "www.esa.example"
country = "EU"
institution = "European Space Agency"
publisher_entity = "esa"
language = "en"
fixture = ["esa.xml", "history/fx-esa.xml"]

