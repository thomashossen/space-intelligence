# Controlled entity nomenclature (gazetteer).
#
# One block per entity. Matching is alias-based, longest match first, on word boundaries.
# Case: aliases written ALL CAPS with 5 characters or fewer (ESA, SES, MBDA, US…) match
# case-sensitively so that "ses" or "esa" in another language never match; every other
# alias matches case-insensitively, so "Airbus", "Airbus SE" and "AIRBUS" are one entity.
#
# type     company | organization | country | region | technology | material | programme
# country  ISO 3166-1 alpha-2 (EU / INT for multinational)
# sector   AERONAUTICS | SPACE | DEFENSE | MULTI
# parent   entity id of the parent company (no automatic roll-up of counts)
#
# Adding an entity = adding a block. No code change. Products are modelled as programmes.

version = "1.0.0"

