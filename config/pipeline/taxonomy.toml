kind = "sector"
keywords = ["space", "satellite*", "orbit*", "launch vehicle*", "launcher*", "spaceport", "spatial*", "spatiale", "lanceur*", "spacecraft"]
entities = ["type:programme:SPACE", "esa", "nasa", "cnes", "dlr", "euspa", "arianespace", "arianegroup", "maiaspace", "isar", "rfa", "rocket-lab", "spacex", "ohb", "thales-alenia-space", "avio", "exploration-company", "eutelsat", "ses"]

