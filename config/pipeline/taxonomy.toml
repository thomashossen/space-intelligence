# Multi-label classification taxonomy.
#
# A label is assigned when its score reaches `threshold` (default [settings].threshold).
#   score = title_weight × keyword hits in the title
#         + body_weight  × keyword hits in summary/content (counted once per keyword)
#         + entity_weight × matching entities (ids, or "type:<entity type>")
# Every assigned label stores the keywords and entities that triggered it (evidence).
# kind = "sector" labels fill the `sectors` field; the others fill `topics`.
# Adding a category = adding a block. Keywords are lowercase, matched on word
# boundaries; a trailing "*" allows any suffix (launch* → launches, launched).

version = "1.0.0"

[settings]
threshold = 2
title_weight = 2
body_weight = 1
entity_weight = 2

[category.AERONAUTICS]
kind = "sector"
keywords = ["aircraft", "airliner*", "aviation", "airframe*", "jet engine*", "business jet*", "turbofan*", "avion*", "aéronautique", "helicopter*", "certification", "airline*"]
entities = ["airbus", "boeing", "safran", "rolls-royce", "ge-aerospace", "pratt-whitney", "embraer", "bombardier", "gulfstream", "textron", "a320", "a350", "falcon-10x", "global-8000", "g700", "business-jets", "saf"]

