# ------------------------------------------------------------------ event types
# Ordered: on equal hit counts, the first listed wins. "other" when nothing matches.
[event_types]
contract = ["contract*", "award*", "order*", "selects", "selected", "picks", "chosen", "chooses", "wins", "won", "commande*", "contrat*", "notif*"]
launch = ["launch", "launches", "launched", "lift-off", "liftoff", "lancement", "lifted off", "placed into orbit"]
test = ["test", "tests", "tested", "hot-fire", "trial*", "demonstration", "exercise", "essai*", "flight test*"]
delivery = ["deliver*", "handover", "livraison*", "livre", "handed over"]
partnership = ["partnership", "partners with", "teams up", "agreement", "memorandum", "mou", "partenariat", "accord", "cooperation"]
acquisition = ["acquire*", "acquisition", "takeover", "merger", "rachat"]
investment = ["invest*", "funding", "raises", "factory", "plant", "production capacity", "usine", "capex", "ramp-up"]
regulation = ["regulation", "directive", "work programme", "call for proposals", "legislation", "règlement"]
export_control = ["export control*", "export licen*", "export restriction*", "embargo", "export ban"]
schedule_change = ["delay*", "postpone*", "slip*", "rescheduled", "retard*", "report du"]
research = ["paper", "we propose", "we present", "study", "abstract", "preprint", "article scientifique"]
