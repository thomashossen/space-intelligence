# Live source registry used by `python -m app.pipeline run --live`.
#
# Free endpoints only, no key, no login. Respect each site's terms and rate limits
# (min_interval_s). Never add LinkedIn, Facebook or X scraping here.
#
# Check every endpoint from your machine before relying on it:
#   python -m app.pipeline check                    # HTTP status, entries parsed, newest date
#   python -m app.pipeline check --disable-failing  # also sets enabled = false on failing sources
#
# max_items keeps only the N most recent entries per run, so a high-volume
# aggregator (Google News, GDELT) cannot drown the specialised press.
# Press titles below are real publications; their feed URLs follow the usual
# WordPress / Arc conventions and must be confirmed with `check`.

version = "live-2"

# ---------------------------------------------------------------- institutions (tier 1)
[[source]]
id = "esa-news"
name = "ESA — Space News"
connector = "rss"
source_type = "institutional"
family = "INS"
tier = 1
domain = "www.esa.int"
country = "EU"
institution = "European Space Agency"
publisher_entity = "esa"
language = "en"
url = "https://www.esa.int/rssfeed/Our_Activities/Space_News"
enabled = true

[[source]]
id = "nasa-releases"
